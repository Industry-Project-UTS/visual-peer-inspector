  <text x="60" y="175" font-family="Arial, sans-serif" font-size="22" fill="#1f2933">Top-1 accuracy</text>
  <rect x="300" y="150" width="650" height="36" rx="4" fill="#d9e2ec"/>
  <rect x="300" y="150" width="423" height="36" rx="4" fill="#486f96"/>
